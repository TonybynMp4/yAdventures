name: release

# Push a tag (git tag v1.0.0 && git push origin v1.0.0), or run it by hand with a tag name
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created on the selected branch if it doesn't exist)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the commit list
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The version shows in the pack's description in game
      - run: PACK_VERSION="$TAG" bun run build

      # Don't release a pack that fails to load
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v6
        with:
          path: /tmp/yadv-ci/server.jar
          key: server-jar-33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c
      - run: scripts/load-test.sh /tmp/yadv-ci

      - name: Zip the datapack
        run: |
          mkdir dist
          (cd .sandstone/output/datapack && zip -qr "$GITHUB_WORKSPACE/dist/yAdventures-$TAG.zip" .)
      # Commits since the previous v* tag (all of them for the first release); GitHub links the hashes
      - name: Write the notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          {
            cat .github/release-notes.md
            echo
            echo "## Commits${prev:+ since $prev}"
            echo
            git log --no-merges --format='- %s (%h)' ${prev:+$prev..}HEAD
          } > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" \
            --title "yAdventures $TAG" --notes-file notes.md
