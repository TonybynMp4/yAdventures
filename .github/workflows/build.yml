name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: PACK_VERSION="dev-${GITHUB_SHA::7}" bun run build
      # Downloads as a zip with pack.mcmeta at its root, ready to drop in
      - uses: actions/upload-artifact@v4
        with:
          name: yAdventures-datapack
          path: .sandstone/output/datapack
          if-no-files-found: error

  # Boots a 26.3 server with the datapack and fails on any load or runtime error
  load-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: yAdventures-datapack
          path: datapack
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v4
        with:
          path: /tmp/yadv-ci/server.jar
          key: server-jar-33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c
      - run: scripts/load-test.sh /tmp/yadv-ci
        env:
          PACK: ${{ github.workspace }}/datapack
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: /tmp/yadv-ci/log.txt
